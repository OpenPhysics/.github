name: Shared compliance check

on:
  workflow_call:
    inputs:
      repo-name:
        description: Repository name to check (defaults to calling repository)
        type: string
        required: false
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  check-single:
    if: github.event_name == 'workflow_call'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run compliance checks
        run: |
          REPO="${{ inputs.repo-name }}"
          if [ -z "$REPO" ]; then
            REPO="${{ github.event.repository.name }}"
          fi
          echo "Checking repository: $REPO"
          ./.github/scripts/check-repo-compliance.sh "$PWD"

  check-all:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Audit simulation repositories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SIMS=$(jq -r '.repos[] | select(.isSimulation == true) | .name' structure/repos.json)
          FAILED=0
          for sim in $SIMS; do
            echo "======== $sim ========"
            WORKDIR=$(mktemp -d)
            gh repo clone "OpenPhysics/$sim" "$WORKDIR" -- --depth 1
            if ! ./.github/scripts/check-repo-compliance.sh "$WORKDIR"; then
              FAILED=1
            fi
            rm -rf "$WORKDIR"
          done
          exit $FAILED
